name: Frontend syntax check

on:
  push:
    branches: [main]
    paths:
      - "app/app.py"
      - "app/components.py"
      - "app/ui_utils.py"
      - ".github/workflows/frontend-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile frontend modules
        run: python -m py_compile app/app.py app/components.py app/ui_utils.py
