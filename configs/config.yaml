# ============================================================
# configs/config.yaml — Main project configuration
# PRG4206 | AI-Generated Text Detection System
# ============================================================

project:
  name: "AI-Generated Text Detection System"
  version: "1.0.0"
  random_state: 42

dataset:
  hf_repo: "Hello-SimpleAI/HC3"
  subset: "all"
  license: "CC BY-SA 4.0"
  max_samples: null   # null = use full dataset; set integer for quick experiments

split:
  train: 0.70
  val:   0.15
  test:  0.15
  stratify: true

tfidf:
  max_features: 50000
  min_df: 2
  max_df: 0.95
  sublinear_tf: true
  ngram_range: [1, 2]

models:
  logistic_regression:
    solver: liblinear
    max_iter: 1000

  linear_svm:
    max_iter: 5000

  xgboost:
    objective: "binary:logistic"
    eval_metric: "logloss"
    n_jobs: -1

  distilbert:
    base_model: "distilbert-base-uncased"
    max_length: 256
    batch_size: 16
    epochs: 3
    learning_rate: 2.0e-5
    weight_decay: 0.01

cross_validation:
  folds: 5

document_analysis:
  min_chunk_words: 50
  max_chunk_words: 250
  chunk_overlap_words: 0
  min_text_words: 10

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models: "models"
  results: "results"
  figures: "results/figures"
